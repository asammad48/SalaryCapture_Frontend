<div class="login">
  <progress-loading loaderKey="Account_Login"></progress-loading>
  <span class="illustration">
    <img src="./assets/img/login-img.webp" />
  </span>

  <div class="main-section">
    <div class="logo-section">
      <div class="logo">
        <!-- Logo SVG content remains unchanged -->
      </div>
    </div>

    <div class="login-section">
      <div class="login-form">
        <div class="heading-section">
          <h1>Sign In</h1>
          <p>Sign in using your Microsoft Entra account</p>
        </div>

        <button type="button" class="microsoft-btn" (click)="loginWithEntra()">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21">
            <path fill="#f25022" d="M1 1h9v9H1z"/>
            <path fill="#00a4ef" d="M1 11h9v9H1z"/>
            <path fill="#7fba00" d="M11 1h9v9h-9z"/>
            <path fill="#ffb900" d="M11 11h9v9h-9z"/>
          </svg>
          <span>Sign in with Microsoft</span>
        </button>
      </div>
    </div>
  </div>
</div>

<p-toast position="bottom-right" styleClass="toast-custom-icon"></p-toast>
